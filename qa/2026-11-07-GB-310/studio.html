<!doctype html><meta charset="utf-8"><title>GB-310 knife/machete studio</title>
<style>html,body{margin:0;background:#121418;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.webgpu.js","three/webgpu":"../../vendor/three/three.webgpu.js","three/tsl":"../../vendor/three/three.tsl.js","three/addons/":"../../vendor/three/addons/"}}</script>
<script type="module">
window.onerror = (m,s,l,c,e) => { window.ERR = String((e && e.stack) || m); };
import * as THREE from 'three';
import { weaponModelContext } from '../../tools/marine-inspector.js';
import { makeKnifeModel } from '../../studio/weapon-sidearms.js';
import { floatingParts } from '../../studio/gun-detail.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'side';
const which = q.get('which') || 'knife';
const MARINE_UPM = 1.655 / 1.80;
const sizeK = 0.55 * MARINE_UPM / 0.660;

const R = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
R.setSize(1280, 720); document.body.appendChild(R.domElement); await R.init();
const Sc = new THREE.Scene(); Sc.background = new THREE.Color(0x121418);
Sc.add(new THREE.HemisphereLight(0xdde2ea, 0x2a2722, 1.2));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.7); sun.position.set(2.2, 3.5, 2.8); Sc.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.65); fill.position.set(-2.2, 1.2, -1.2); Sc.add(fill);
const rim = new THREE.DirectionalLight(0xaaccff, 0.35); rim.position.set(-1, 2, -3); Sc.add(rim);

const root = makeKnifeModel(weaponModelContext());
root.visible = true;
const kn = root.userData.knifeModel;
const mc = root.userData.macheteModel;
if (kn) kn.visible = which === 'knife';
if (mc) mc.visible = which === 'machete';
root.scale.setScalar(sizeK);
Sc.add(root);
root.traverse((o) => {
  if (/laser|muzzle|flash|spark|smoke/i.test(o.name || '')) o.visible = false;
  if (o.isSprite || (o.isPoints && o !== root)) o.visible = false;
});
root.updateMatrixWorld(true);

const focus = which === 'machete' ? mc : kn;
let tris = 0, meshes = 0;
const matIds = new Set();
focus.traverse((o) => {
  if (!o.isMesh || !o.geometry || !o.visible) return;
  meshes++;
  if (o.material) matIds.add(o.material.uuid);
  const idx = o.geometry.index, pos = o.geometry.attributes.position;
  tris += idx ? idx.count / 3 : pos.count / 3;
});
const box = new THREE.Box3().setFromObject(focus);
const size = box.getSize(new THREE.Vector3());
const floats = floatingParts(THREE, focus);
window.METRICS = {
  which, tris: Math.round(tris), meshes, materials: matIds.size, floatingCount: floats.length,
  bbox: { x:+size.x.toFixed(4), y:+size.y.toFixed(4), z:+size.z.toFixed(4) },
  sizeK
};

const C = new THREE.PerspectiveCamera(32, 1280/720, 0.004, 20);
const mid = box.getCenter(new THREE.Vector3());
const extent = Math.max(size.x, size.y, size.z, 0.05);
if (view === 'side') {
  C.position.set(mid.x + extent * 1.6, mid.y + 0.01, mid.z);
  C.lookAt(mid);
} else if (view === 'top') {
  C.position.set(mid.x, mid.y + extent * 1.6, mid.z);
  C.up.set(0, 0, -1); C.lookAt(mid); C.up.set(0, 1, 0);
} else if (view === 'tq') {
  C.position.set(mid.x + extent * 1.1, mid.y + extent * 0.55, mid.z + extent * 0.7);
  C.lookAt(mid);
} else if (view === 'blade') {
  C.fov = 28; C.updateProjectionMatrix();
  const look = mid.clone(); look.z += size.z * 0.15;
  C.position.set(look.x + extent * 0.55, look.y + extent * 0.08, look.z);
  C.lookAt(look);
} else if (view === 'grip') {
  C.fov = 28; C.updateProjectionMatrix();
  const look = mid.clone(); look.z -= size.z * 0.28;
  C.position.set(look.x + extent * 0.45, look.y + extent * 0.05, look.z);
  C.lookAt(look);
}
R.render(Sc, C); await new Promise((r) => setTimeout(r, 200)); R.render(Sc, C);
window.DONE = true;
</script>
