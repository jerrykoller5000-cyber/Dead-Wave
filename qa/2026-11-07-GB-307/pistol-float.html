<script type="module">
window.onerror = (m,s,l,c,e) => { window.ERR = String((e && e.stack) || m); window.DONE = true; };
import * as THREE from 'three';
import { weaponModelContext } from '../../tools/marine-inspector.js';
import { makePistolModel } from '../../studio/weapon-sidearms.js';
const SKIP_NAME = /flash|laser|flare|suppressor|light/i;
const EPS = 0.0015, SMALL_MAX = 0.018;
function aabbOf(mesh) { mesh.updateWorldMatrix(true, false); return new THREE.Box3().setFromObject(mesh); }
function vol(b) { const s = b.getSize(new THREE.Vector3()); return Math.max(0,s.x)*Math.max(0,s.y)*Math.max(0,s.z); }
function longest(b) { const s = b.getSize(new THREE.Vector3()); return Math.max(s.x,s.y,s.z); }
function touches(a,b,eps){ return a.clone().expandByScalar(eps).intersectsBox(b); }
let captured = null;
const ctxBase = weaponModelContext();
const ctx = { ...ctxBase, finishGun(gun) {
  gun.updateMatrixWorld(true);
  const meshes = [];
  gun.traverse((o) => {
    if (!o.isMesh) return;
    if (o.name && SKIP_NAME.test(o.name)) return;
    const mat = o.material; if (mat && mat.transparent && mat.opacity === 0) return;
    const b = aabbOf(o); if (b.isEmpty()) return;
    meshes.push({ mesh: o, box: b, vol: vol(b), long: longest(b), pos: o.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(4)) });
  });
  const smalls = meshes.filter((m) => m.long <= SMALL_MAX && m.vol > 0);
  const bigs = meshes.filter((m) => m.long > SMALL_MAX);
  const floaters = [];
  for (const s of smalls) {
    let any = false;
    for (const b of bigs) { if (b.mesh === s.mesh) continue; if (touches(s.box, b.box, EPS)) { any = true; break; } }
    if (!any) {
      const c = s.box.getCenter(new THREE.Vector3());
      floaters.push({ c: c.toArray().map(v=>+v.toFixed(4)), long: +s.long.toFixed(4), pos: s.pos });
    }
  }
  captured = { small: smalls.length, big: bigs.length, float: floaters.length, floaters, meshCount: meshes.length };
  return ctxBase.finishGun(gun);
}};
makePistolModel(ctx);
window.OUT = captured;
document.body.textContent = JSON.stringify(captured, null, 2);
window.DONE = true;
</script>
