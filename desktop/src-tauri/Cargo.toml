[package]
name = "dead-wave"
version = "0.1.0"
description = "Dead-Wave"
authors = ["Dead-Wave crew"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
# A smaller exe; the game is the weight, not the shell.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
