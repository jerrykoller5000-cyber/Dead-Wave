<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dead-Wave · Motion lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #1d2330; --panel: rgba(18, 22, 30, 0.92); --ink: #e8e4d4; --dim: #9aa3b2; --accent: #e0b85a; --good: #7cdea0; --bad: #ff7a6a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid #333b4a; border-radius: 8px; padding: 12px 14px; box-sizing: border-box; }
  #controls { top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; }
  #notes { bottom: 12px; right: 12px; width: 360px; }
  #readout { top: 12px; right: 12px; width: 260px; font: 12px/1.45 ui-monospace, monospace; }
  h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .04em; } h2 { font-size: 12px; margin: 12px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  button, select { font: inherit; color: var(--ink); background: #2c3444; border: 1px solid #45506a; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  button:hover { background: #38435a; } button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  label.sl { display: grid; grid-template-columns: 58px 1fr 36px; align-items: center; gap: 6px; margin: 3px 0; color: var(--dim); }
  input[type=range] { width: 100%; }
  textarea { width: 100%; height: 90px; box-sizing: border-box; background: #10141b; color: var(--ink); border: 1px solid #45506a; border-radius: 5px; padding: 6px; font: inherit; resize: vertical; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  #saved { font-size: 12px; margin-top: 6px; min-height: 1.4em; }
  .ev { color: var(--good); } .st { color: var(--accent); }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.webgpu.js","three/webgpu":"../vendor/three/three.webgpu.js","three/tsl":"../vendor/three/three.tsl.js"}}</script>
</head><body>
<div id="controls" class="panel">
  <h1>Motion lab</h1>
  <div class="hint">Pick a weapon, then click the body where it hits. Drag to turn the camera, wheel to zoom.</div>
  <h2>Body</h2>
  <select id="preset"></select>
  <h2>Weapon</h2>
  <div class="grid" id="weapons"></div>
  <h2>Time</h2>
  <div class="grid">
    <button data-speed="1" class="on">Real speed</button><button data-speed="0.25">Quarter speed</button>
    <button id="replay">Again</button><button id="reset">Stand up</button>
  </div>
  <h2>Muscles (try it, then say it in a note)</h2>
  <div id="sliders"></div>
  <button id="fromfile" style="margin-top:6px">Back to the file's values</button>
</div>
<div id="readout" class="panel"></div>
<div id="notes" class="panel">
  <h1>Your note</h1>
  <textarea id="note" placeholder="What should change? e.g. The shotgun stagger is good but he gets up too fast. The brute should rock back more."></textarea>
  <div class="grid" style="margin-top:6px"><button id="save">Save note for the crew</button><button id="approve">It's good</button></div>
  <div id="saved"></div>
  <div class="hint">Notes go to review/motion-&lt;body&gt;/notes.md, with what you last did here. The owner answers there and on the crew panel.</div>
</div>
<script type="module">
// studio/motion-lab.html — Jerry's bench for reactions (D-42). Claude's. Served by tools/serve.mjs
// ("Open Motion Lab.bat"): studio/motion-lab.html?preset=zombie/shambler. Pure studio code: the same
// createBody the game and the scenes run, on the studio rigs.
import * as THREE from 'three';
import { rigs, loadMotion, createBody, loadClip, createPlayer } from './index.js';
import { presets } from './motion/index.js';

const WEAPONS = [
  { key: 'rifle', label: 'Rifle round', kind: 'bullet', power: 2.5 },
  { key: 'shotFar', label: 'Shotgun, 6 m', kind: 'pellet', power: 3.2 },
  { key: 'shotClose', label: 'Shotgun, close', kind: 'pellet', power: 6.5 },
  { key: 'blade', label: 'Machete', kind: 'blade', power: 3.5 },
  { key: 'swing', label: "Brute's swing", kind: 'crush', power: 4.5 },
  { key: 'grenade', label: 'Grenade', kind: 'blast', power: 8, up: 0.5 },
  { key: 'kill', label: 'Killing shot', kind: 'bullet', power: 3, kill: true }
];
const CLIPS = { zombie: 'zombie/idle', marine: 'marine/stand' };
const q = new URLSearchParams(location.search);
let ref = presets.json(q.get('preset')) ? q.get('preset') : 'zombie/shambler';
let weapon = WEAPONS[2], speed = 1, overrides = {}, last = null, history = [];

const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
await renderer.init();
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3140);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.2); sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x4f6a3a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
{ const g = new THREE.GridHelper(60, 60, 0x35502a, 0x35502a); g.position.y = 0.005; scene.add(g); }
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);
const orbit = { yaw: 0.6, pitch: 0.28, dist: 5.2, at: new THREE.Vector3(0, 0.9, 0) };
const placeCam = () => {
  camera.position.set(orbit.at.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, orbit.at.y + Math.sin(orbit.pitch) * orbit.dist, orbit.at.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
  camera.lookAt(orbit.at);
};
placeCam();

// The body: a studio rig playing its idle, and a reacting body over it.
let inst, player, body, markers = [];
const hitMark = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0xff5040 }));
hitMark.visible = false; scene.add(hitMark);
function presetNow() {
  const src = structuredClone(presets.json(ref));
  src.tone = { ...src.tone, ...(overrides.tone || {}) };
  if (overrides.mass) src.mass = overrides.mass;
  if (overrides.strength) src.strength = overrides.strength;
  return loadMotion(src);
}
async function build() {
  if (inst) scene.remove(inst.group);
  const p = presets.json(ref);
  const brute = ref.endsWith('/brute');
  inst = rigs.get(p.rig).create(p.rig === 'zombie' ? { type: ref.split('/')[1], scale: brute ? 1.38 : 1 } : {});
  inst.group.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(inst.group);
  const clip = loadClip(await (await fetch('./clips/' + CLIPS[p.rig] + '.json')).json());
  player = createPlayer(inst).play(clip, { loop: true });
  body = createBody(inst, presetNow(), { ground: () => 0 });
  history = []; last = null; hitMark.visible = false;
  // Where the body stands. The game stands a zombie's feet 0.2 m into the ground (studio/zombie.js);
  // the lab lifts it so its boots are on the floor (the body measures its own depth either way).
  inst.group.position.set(0, p.rig === 'zombie' ? 0.26 * (brute ? 1.38 : 1) : 0, 0);
}

// Clicking the body: hit where the ray lands, pushed along the ray.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 3) drag.moved = true;
  if (drag.moved) { orbit.yaw -= dx * 0.008; orbit.pitch = Math.max(-0.1, Math.min(1.3, orbit.pitch + dy * 0.006)); drag.x = e.clientX; drag.y = e.clientY; placeCam(); }
});
addEventListener('pointerup', (e) => {
  if (drag && !drag.moved && e.target === renderer.domElement) {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(inst.group, true)[0];
    if (hit) strike(hit.point.toArray(), ray.ray.direction.toArray());
  }
  drag = null;
});
renderer.domElement.addEventListener('wheel', (e) => { orbit.dist = Math.max(1.5, Math.min(14, orbit.dist * (1 + Math.sign(e.deltaY) * 0.1))); placeCam(); e.preventDefault(); }, { passive: false });

function strike(at, dir) {
  const w = weapon;
  const d = [dir[0], dir[1] + (w.up || 0), dir[2]];
  last = { w, at, dir: d };
  hitMark.position.set(...at); hitMark.visible = true;
  const ok = w.kill ? body.kill({ at, dir: d, power: w.power, kind: w.kind }) : body.hit({ at, dir: d, power: w.power, kind: w.kind });
  history.push(`${(performance.now() / 1000).toFixed(1)} ${w.label}${ok ? '' : ' (refused)'}`);
}

// Panels
const presetSel = document.getElementById('preset');
for (const n of presets.names()) presetSel.add(new Option(n + (presets.json(n).notes ? '' : ''), n));
presetSel.value = ref;
presetSel.onchange = async () => { ref = presetSel.value; overrides = {}; history = []; drawSliders(); await build(); history.push('body: ' + ref); };
const wbox = document.getElementById('weapons');
for (const w of WEAPONS) {
  const b = document.createElement('button'); b.textContent = w.label; if (w === weapon) b.classList.add('on');
  b.onclick = () => { weapon = w; for (const c of wbox.children) c.classList.toggle('on', c === b); };
  wbox.append(b);
}
for (const b of document.querySelectorAll('[data-speed]')) b.onclick = () => { speed = +b.dataset.speed; for (const c of document.querySelectorAll('[data-speed]')) c.classList.toggle('on', c === b); };
document.getElementById('reset').onclick = () => { body.reset(); hitMark.visible = false; };
document.getElementById('replay').onclick = () => { if (!last) return; body.reset(); body.follow(); const w = weapon; weapon = last.w; strike(last.at, last.dir); weapon = w; };
function drawSliders() {
  const box = document.getElementById('sliders'); box.replaceChildren();
  const p = loadMotion(presets.json(ref));
  const add = (label, get, set, min, max, step) => {
    const l = document.createElement('label'); l.className = 'sl';
    const s = document.createElement('input'); s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = get();
    const o = document.createElement('span'); o.textContent = (+s.value).toFixed(2);
    s.oninput = () => { set(+s.value); o.textContent = (+s.value).toFixed(2); body = createBody(inst, presetNow(), { ground: () => 0 }); };
    l.append(label, s, o); box.append(l);
  };
  for (const g of ['legs', 'spine', 'arms', 'head']) add(g, () => (overrides.tone || {})[g] ?? p.tone[g], (v) => { (overrides.tone ||= {})[g] = v; }, 0, 1, 0.01);
  add('weight', () => overrides.mass ?? p.mass, (v) => { overrides.mass = v; }, 0.3, 4, 0.05);
  add('strength', () => overrides.strength ?? p.strength, (v) => { overrides.strength = v; }, 0.2, 3, 0.05);
}
document.getElementById('fromfile').onclick = () => { overrides = {}; drawSliders(); body = createBody(inst, presetNow(), { ground: () => 0 }); };
drawSliders();

// Notes: straight into the review folder when served by tools/serve.mjs; copied otherwise.
function context() {
  const p = presets.json(ref), bits = [`${ref} v${p.version || 1}`];
  if (last) bits.push(`last: ${last.w.label} (${last.w.kind}, ${last.w.power} m/s)`);
  const ch = [];
  for (const [g, v] of Object.entries(overrides.tone || {})) ch.push(`${g} tone ${v.toFixed(2)} (file ${p.tone[g] ?? '-'})`);
  if (overrides.mass) ch.push(`weight ${overrides.mass} (file ${p.mass ?? 1})`);
  if (overrides.strength) ch.push(`strength ${overrides.strength} (file ${p.strength ?? 1})`);
  if (ch.length) bits.push('sliders: ' + ch.join(', '));
  return bits.join('; ');
}
async function send(text) {
  const out = document.getElementById('saved');
  try {
    const r = await fetch('/__studio/note', { method: 'POST', body: JSON.stringify({ preset: ref, text, context: context() }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    out.innerHTML = `<span class="ev">Saved to ${j.file}.</span> ${j.owner} sees it on the crew panel.`;
    document.getElementById('note').value = '';
  } catch (e) {
    const asset = 'motion-' + ref.replace('/', '-');
    const block = `## ${new Date().toISOString().slice(0, 10)} · Jerry · v${presets.json(ref).version || 1} · lab\n${text}\n(In the lab: ${context()})\n`;
    try { await navigator.clipboard.writeText(block); } catch {}
    out.innerHTML = `<span style="color:var(--bad)">Couldn't save here</span> (open the lab with "Open Motion Lab.bat"). The note is copied: paste it at the top of review/${asset}/notes.md.`;
  }
}
document.getElementById('save').onclick = () => { const t = document.getElementById('note').value.trim(); if (t) send(t); };
document.getElementById('approve').onclick = () => send('good');

// Loop
const clock = new THREE.Clock();
const readout = document.getElementById('readout');
let evLog = [];
await build();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()) * speed;
  player.update(dt, {});
  body.follow();
  for (const e of body.update(dt)) evLog.push(e[0]);
  body.apply();
  evLog = evLog.slice(-8);
  const p = presets.json(ref);
  readout.innerHTML = `<div><b>${ref}</b> v${p.version || 1} · owner ${p.owner || 'grokbot'}</div>
    <div>state <span class="st">${body.state}</span> · sim ${(body.weight * 100).toFixed(0)}%</div>
    <div>off balance ${((body.offBalance || 0) * 100).toFixed(0)} cm</div>
    <div style="margin-top:6px">${evLog.map((e) => `<span class="ev">${e}</span>`).join(' ') || '&nbsp;'}</div>
    <div class="hint">${p.notes || ''}</div>`;
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body></html>
