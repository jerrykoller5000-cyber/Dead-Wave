<html lang="en"><head><meta charset="utf-8"><title>Dead-Wave · Model lab</title>

<style>

<div id="side" class="panel">

</div>
<div id="notes" class="panel">

<script type="module">
// studio/model-lab.html — look at a model (docs/drafts/model.md). Claude's. Served by tools/serve.mjs:
//   studio/model-lab.html?model=prop/evac-boat                   turn round it, see its cost, write a note
//   studio/model-lab.html?model=creature/spider&clip=spider/crawl  a creature that is a rig, playing a clip
//   studio/model-lab.html?mode=sheet&model=prop/evac-boat         the contact sheet studio/model-sheet.mjs saves

import * as THREE from 'three';

const q = new URLSearchParams(location.search);

// A draft file (?file=, repo-relative) stands in for its listed namesake, if it has one.
const draft = q.get('file') ? await (await fetch('../' + q.get('file'))).json() : null;

sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;

const water = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x2d5a6e, roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.55 }));

const marine = rigs.get('marine').create({});
scene.add(marine.group);
const jointDots = new THREE.Group(); scene.add(jointDots);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffd040, depthTest: false });
const dotGeo = new THREE.SphereGeometry(0.035, 8, 6);

let built = null, inst = null, player = null, night = false, wire = false, showJoints = SHEET && q.get('joints') !== '0';
function setNight(on) {
  night = on;
  const L = on ? NIGHT : DAY;
  scene.background = new THREE.Color(L.bg); hemi.intensity = L.hemi; sun.intensity = L.sun;
  document.getElementById('night').classList.toggle('on', on);
}
setNight(false);

// The model: built by buildModel, or created as its rig when it is one (so a clip can play on it).
function load() {
  if (inst) { scene.remove(inst.group); inst = null; player = null; }
  const json = modelJson(ref);
  const b = buildModel(json);
  built = b;
  let group = b.group;
  if (json.rig || json.body) {
    // A draft of a rig plays as its own rig, so the listed one is left as it is; a model with a body
    // but no rig of its own (the zombie stand-in) gets one here, so it can react.
    const own = json.rig || 'model-' + json.name;
    const name = json === draft ? own + '-draft' : own;
    if (!rigs.def(name)) registerRig(name, rigFromModel(json));
    inst = rigs.get(name).create({ group: b.group });

  }
  scene.add(group);
  group.traverse((o) => { if (o.isMesh) o.material.wireframe = wire; });
  const box = new THREE.Box3().setFromObject(group);
  // The marine stands just off the model's left (its -X), facing the same way.
  marine.group.position.set(box.min.x - 0.6, 0, (box.min.z + box.max.z) / 2);
  const wl = b.joints.waterline;
  water.visible = !!wl;
  if (wl) water.position.y = new THREE.Vector3().setFromMatrixPosition(wl.matrixWorld).y;
  jointDots.clear();
  for (const j of Object.values(b.joints)) { const d = new THREE.Mesh(dotGeo, dotMat); d.renderOrder = 10; d.userData.joint = j; jointDots.add(d); }

}

}

  const c = built.cost, b = json.budget;
  const ok = (v, max) => `<span class="${v > max ? 'bad' : 'good'}">${v}</span> of ${max}`;
  return {
    info: `<b>${ref}</b> v${json.version || 1} · ${json.kind} · owner ${json.owner || 'claude'}<br>${json.notes || ''}`,
    cost: `draws ${ok(c.draws, b.draws)} · triangles ${ok(c.triangles, b.triangles)}<br><span class="hint">${Object.keys(built.joints).length} joints, ${json.parts.length} parts, ${built.parts.length} drawn, merge ${JSON.stringify(json.merge ?? false)}</span>`,
    mats: Object.entries(json.materials).map(([n, m]) => `<span class="sw"><i style="background:${m.color}${m.emissive ? `;box-shadow:0 0 6px ${m.emissive}` : ''}"></i>${n}</span>`).join('')
  };
}

// Fit a camera looking from `dir` at the model and the marine.
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 400);

  sun.position.copy(sphere.center).add(new THREE.Vector3(5, 9, 6).multiplyScalar(Math.max(1, sphere.radius / 2)));

  const r = sphere.radius * 1.5;
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.1, far: r * 6 });
  sun.shadow.camera.updateProjectionMatrix();

  // --- The contact sheet: six views, the cost against the budget, the materials, and the joints named.
  document.body.classList.add('sheet');
  const problems = validateModel(modelJson(ref));
  if (problems.length) {
    // Not buildable: the sheet is the problems, as sentences, so the picture still says what to fix.
    const out = document.createElement('canvas'); out.width = 1600; out.height = 120 + problems.length * 22; document.body.append(out);
    const cx = out.getContext('2d');
    cx.fillStyle = '#14181f'; cx.fillRect(0, 0, out.width, out.height);
    cx.font = '22px system-ui, sans-serif'; cx.fillStyle = '#ff7a6a'; cx.fillText(`${ref} is not valid: ${problems.length} problem${problems.length > 1 ? 's' : ''}`, 16, 40);
    cx.font = '15px ui-monospace, monospace'; cx.fillStyle = '#e8e4d4';
    problems.forEach((t, i) => cx.fillText('- ' + t, 16, 80 + i * 22));
    renderer.domElement.style.display = 'none';
    window.__size = { w: out.width, h: out.height };
    window.__stats = { model: ref, errors: problems };
    window.__ready = true;
    throw new Error(`${ref} is not valid (the sheet lists why)`);
  }
  const { json, group } = load();
  const clipRef = q.get('clip');
  const W = 1600, TW = 532, TH = 420, HEAD = 118, FRAMES = +(q.get('frames') || 6);
  const clip = clipRef && inst ? loadClip(await (await fetch(`./clips/${clipRef}.json`)).json()) : null;
  const H = HEAD + TH * 2 + (clip ? 260 : 0) + 8;
  const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.append(out);
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#14181f'; ctx.fillRect(0, 0, W, H);
  renderer.setSize(TW, TH);
  const emissive = Object.values(json.materials).some((m) => m.emissive);
  const views = [
    ['three-quarter', [1, 0.55, 1.25]], ['front (+Z)', [0, 0.18, 1]], ['right side (+X)', [1, 0.18, 0]],
    ['back', [0, 0.18, -1]], ['top', [0, 1, 0]], emissive ? ['night', [-1, 0.45, 1.1]] : ['three-quarter, behind', [-1, 0.55, -1.25]]
  ];
  const box = new THREE.Box3().setFromObject(group).union(new THREE.Box3().setFromObject(marine.group));
  const label = (text, x, y, color = '#e8e4d4', size = 15) => { ctx.font = `${size}px system-ui, sans-serif`; ctx.fillStyle = color; ctx.fillText(text, x, y); };
  views.forEach(([name, dir], i) => {
    setNight(name === 'night');
    frame(camera, dir, box, TW / TH);
    placeDots();
    jointDots.visible = showJoints && i === 0;   // the joints on the first view only, where they're named
    renderer.render(scene, camera);
    const x = (i % 3) * (TW + 2), y = HEAD + Math.floor(i / 3) * (TH + 2);
    ctx.drawImage(renderer.domElement, x, y, TW, TH);
    label(name, x + 10, y + 22);
    // The joints named on the first view, where they are.
    if (i === 0 && showJoints) {
      ctx.font = '12px ui-monospace, monospace';
      for (const [n, j] of Object.entries(built.joints)) {
        const p = new THREE.Vector3().setFromMatrixPosition(j.matrixWorld).project(camera);
        if (p.z > 1) continue;
        const sx = x + (p.x + 1) / 2 * TW, sy = y + (1 - p.y) / 2 * TH;
        ctx.fillStyle = '#000a'; ctx.fillText(n, sx + 5, sy - 3); ctx.fillStyle = '#ffd040'; ctx.fillText(n, sx + 4, sy - 4);
      }
    }
  });
  setNight(false);
  // A strip of the clip, side on, when the sheet is for a creature playing one.
  if (clip) {
    const fw = Math.floor(W / FRAMES), fh = 250, y0 = HEAD + TH * 2 + 6;
    renderer.setSize(fw, fh);
    player = createPlayer(inst).play(clip);
    marine.group.visible = false; jointDots.visible = false;
    const cbox = new THREE.Box3().setFromObject(group).expandByScalar(0.15);
    for (let f = 0; f < FRAMES; f++) {
      const t = (clip.loop ? f / FRAMES : f / Math.max(1, FRAMES - 1)) * clip.length;
      player.poseAt(t);
      frame(camera, [-1, 0.25, 0.35], cbox, fw / fh, 1.0);
      renderer.render(scene, camera);
      ctx.drawImage(renderer.domElement, f * fw, y0, fw, fh);
      label(`${clipRef} ${t.toFixed(2)} s`, f * fw + 8, y0 + 18, '#e8e4d4', 13);
    }
  }
  // The header: what it is, what it costs, what it's made of.
  const c = built.cost, b = json.budget, over = built.over;
  label(`${ref}  v${json.version || 1}`, 16, 32, '#e0b85a', 22);
  label(`${json.kind} · owner ${json.owner || 'claude'} · ${Object.keys(built.joints).length} joints · ${json.parts.length} parts (${built.parts.length} drawn) · merge ${JSON.stringify(json.merge ?? false)}`, 16, 56, '#9aa3b2', 14);
  label(`draws ${c.draws} of ${b.draws}   triangles ${c.triangles} of ${b.triangles}${over ? '   OVER BUDGET' : ''}`, 16, 82, over ? '#ff7a6a' : '#7cdea0', 17);
  let sx = 16;
  ctx.font = '12px system-ui, sans-serif';
  for (const [n, m] of Object.entries(json.materials)) {
    ctx.fillStyle = m.color; ctx.fillRect(sx, 96, 12, 12);
    ctx.fillStyle = '#9aa3b2'; ctx.fillText(n, sx + 16, 106); sx += 26 + ctx.measureText(n).width;
  }
  const notes = (json.notes || '').slice(0, 170) + ((json.notes || '').length > 170 ? '...' : '');
  ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = '#9aa3b2';
  const words = notes.split(' '); let line = '', ly = 30;
  for (const w of words) { if (ctx.measureText(line + w).width > 620) { ctx.fillText(line, 960, ly); line = ''; ly += 18; } line += w + ' '; }
  ctx.fillText(line, 960, ly);
  renderer.domElement.style.display = 'none';
  window.__size = { w: W, h: H };
  window.__stats = { model: ref, version: json.version || 1, draws: c.draws, triangles: c.triangles, budget: b, over, joints: Object.keys(built.joints), parts: json.parts.length, drawn: built.parts.length };
  window.__ready = true;
} else {
  // --- The live lab.
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);
  const orbit = { yaw: 0.7, pitch: 0.35, dist: 6, at: new THREE.Vector3(0, 0.8, 0) };
  const placeCam = () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    camera.position.set(orbit.at.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, orbit.at.y + Math.sin(orbit.pitch) * orbit.dist, orbit.at.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
    camera.lookAt(orbit.at);
  };
  const show = () => {
    const { json, group } = load();
    const d = describe(json);
    document.getElementById('info').innerHTML = d.info;
    document.getElementById('cost').innerHTML = d.cost;
    document.getElementById('mats').innerHTML = d.mats;
    const box = new THREE.Box3().setFromObject(group), sph = box.clone().union(new THREE.Box3().setFromObject(marine.group)).getBoundingSphere(new THREE.Sphere());
    orbit.at.copy(sph.center); orbit.dist = Math.max(2.5, sph.radius * 3.4);

    placeCam();
    const clipIn = document.getElementById('clip');
    const own = json.rig || json.name, listed = json.clips || [];
    document.getElementById('cliplist').replaceChildren(...listed.map((c) => new Option(c, c)));
    // Its idle under a reaction when it has a body; otherwise the first clip it lists.
    clipIn.value = q.get('clip') || (inst && inst.def.body ? (listed.find((c) => c.endsWith('/idle')) || `${own}/idle`) : (listed[0] || ''));
    armBody(json).then(() => { if (inst && clipIn.value && (q.get('clip') || body || listed.length)) playClip(); });
  };
  // --- Hitting a creature that has a body (studio/motion.js, D-42), with the motion lab's weapons. Its
  // preset is the one for its rig in studio/motion/index.js, or studio/motion/<rig>/<rig>.json.
  const WEAPONS = [
    { label: 'Rifle round', kind: 'bullet', power: 2.5 }, { label: 'Shotgun, 6 m', kind: 'pellet', power: 3.2 },
    { label: 'Shotgun, close', kind: 'pellet', power: 6.5 }, { label: 'Machete', kind: 'blade', power: 3.5 },
    { label: "Brute's swing", kind: 'crush', power: 4.5 }, { label: 'Grenade', kind: 'blast', power: 8, up: 0.5 },
    { label: 'Killing shot', kind: 'bullet', power: 3, kill: true }

  let body = null, weapon = WEAPONS[2], speed = 1, lastHit = null, reactLog = [];
  const wbox = document.getElementById('weapons');

    wbox.append(b);
  }

    if (!inst || !inst.def.body) return;
    const own = json.rig || json.name;

    document.getElementById('hitbox').style.display = '';
  }
  document.getElementById('standup').onclick = () => { if (body) body.reset(); };
  document.getElementById('slow').onclick = (e) => { speed = speed === 1 ? 0.25 : 1; e.target.classList.toggle('on', speed < 1); };
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function strike(ev) {
    ndc.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(inst.group, true)[0];
    if (!hit) return;
    const d = ray.ray.direction, dir = [d.x, d.y + (weapon.up || 0), d.z], at = hit.point.toArray();
    const ok = weapon.kill ? body.kill({ at, dir, power: weapon.power, kind: weapon.kind }) : body.hit({ at, dir, power: weapon.power, kind: weapon.kind });
    lastHit = `${weapon.label} (${weapon.kind}, ${weapon.power} m/s)${ok ? '' : ', refused'}`;
  }
  async function playClip() {
    const r = document.getElementById('clip').value.trim();
    const out = document.getElementById('saved');
    try {
      const clip = loadClip(await (await fetch(`./clips/${r}.json`)).json());
      player = createPlayer(inst).play(clip, { loop: true });
    } catch (e) { out.innerHTML = `<span class="bad">No clip ${r}: ${String(e.message || e).split('\n')[0]}</span>`; }
  }
  document.getElementById('info').onclick = (e) => e.currentTarget.classList.toggle('clamp');
  const sel = document.getElementById('model');
  for (const n of models.names()) sel.add(new Option(n, n));
  if (draft && !models.json(ref)) sel.add(new Option(ref + ' (draft)', ref));
  sel.value = ref;
  sel.onchange = () => { ref = sel.value; history.replaceState(null, '', `?model=${ref}`); show(); };
  const toggle = (id, get, set) => { const b = document.getElementById(id); b.classList.toggle('on', get()); b.onclick = () => { set(!get()); b.classList.toggle('on', get()); }; };
  toggle('joints', () => showJoints, (v) => { showJoints = v; placeDots(); });
  toggle('wire', () => wire, (v) => { wire = v; scene.traverse((o) => { if (o.isMesh && o.userData.model) o.material.wireframe = v; }); });
  toggle('night', () => night, (v) => setNight(v));
  toggle('marine', () => marine.group.visible, (v) => { marine.group.visible = v; });
  document.getElementById('play').onclick = playClip;
  document.getElementById('stop').onclick = () => { player = null; if (inst) for (const [j, r] of inst.rest) { j.quaternion.copy(r.q); j.position.copy(r.p); } };
  let drag = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    orbit.yaw -= (e.clientX - drag.x) * 0.008; orbit.pitch = Math.max(-0.2, Math.min(1.5, orbit.pitch + (e.clientY - drag.y) * 0.006));
    drag.x = e.clientX; drag.y = e.clientY; placeCam();
  });
  // A click that didn't turn the camera is a hit, on a creature with a body.
  addEventListener('pointerup', (e) => { if (drag && drag.moved < 4 && body && e.target === renderer.domElement) strike(e); drag = null; });
  renderer.domElement.addEventListener('wheel', (e) => { orbit.dist = Math.max(0.8, Math.min(60, orbit.dist * (1 + Math.sign(e.deltaY) * 0.1))); placeCam(); e.preventDefault(); }, { passive: false });
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCam(); });

  // Notes: POST /__studio/note (tools/serve.mjs) puts them in review/model-<name>/notes.md, making the
  // folder if it's new; anywhere else the note is copied, to paste in by hand.
  let snapNext = null;
  const snapshot = () => new Promise((resolve) => { snapNext = resolve; });
  async function send(text) {
    const json = modelJson(ref), asset = modelAsset(json), v = 'v' + (json.version || 1);
    const context = `${ref} ${v}; draws ${built.cost.draws}/${json.budget.draws}, triangles ${built.cost.triangles}/${json.budget.triangles}${night ? '; at night' : ''}${player ? '; playing ' + document.getElementById('clip').value : ''}${lastHit ? `; last hit ${lastHit} with ${body.presetName}` : ''}; camera yaw ${orbit.yaw.toFixed(2)} pitch ${orbit.pitch.toFixed(2)} at ${orbit.dist.toFixed(1)} m`;
    const out = document.getElementById('saved');
    const body = {
      asset, text, context,
      meta: { kind: 'model', asset, owner: json.owner || 'claude', model: ref, file: `studio/models/${ref}.json`, version: json.version || 1, look: `studio/model-lab.html?model=${ref}` }
    };
    if (document.getElementById('pic').checked) body.snapshot = await snapshot();
    try {
      const r = await fetch('/__studio/note', { method: 'POST', body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      out.innerHTML = `<span class="good">Saved to ${j.file}${j.picture ? ', with the picture' : ''}.</span> ${j.owner} sees it on the crew panel.`;
      document.getElementById('note').value = '';
    } catch (e) {
      // Say so first: a clipboard that needs permission may never answer.
      const block = `## ${new Date().toISOString().slice(0, 10)} · Jerry · ${v} · lab\n${text}\n(In the model lab: ${context})\n`;
      out.innerHTML = `<span class="bad">Couldn't save here</span> (serve the game with tools/serve.mjs). Paste this at the top of review/${asset}/notes.md:<pre style="white-space:pre-wrap;user-select:all;margin:4px 0 0">${block.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
      const copied = await Promise.race([navigator.clipboard.writeText(block).then(() => true, () => false), new Promise((r) => setTimeout(() => r(false), 1500))]);
      if (copied) out.insertAdjacentHTML('beforeend', '<div class="hint">It is copied already.</div>');
    }
  }
  document.getElementById('save').onclick = () => { const t = document.getElementById('note').value.trim(); if (t) send(t); };
  document.getElementById('approve').onclick = () => send('good');

  show();
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.05, clock.getDelta()) * speed;
    if (player) player.update(dt);
    if (body) {
      body.follow();
      for (const e of body.update(dt)) if (e[0] !== 'step') reactLog.push(e[0]);
      body.apply();
      reactLog = reactLog.slice(-6);
      document.getElementById('react').innerHTML = `${body.presetName}: <span class="good">${body.state}</span>${lastHit ? ` · ${lastHit}` : ''}<br>${reactLog.join(' · ') || 'Pick a weapon and click where it hits.'}`;
    }
    placeDots();
    renderer.render(scene, camera);
    // A picture is taken straight after a frame is drawn, before the browser clears it.
    // At most 1280 wide, so it stays well under the 3 MB a note may carry on a high-DPI screen.
    if (snapNext) {
      const s = snapNext, src = renderer.domElement, k = Math.min(1, 1280 / src.width);
      const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      snapNext = null;
      s(c.toDataURL('image/png'));
    }
  });
  window.__ready = true;
}
</script>
</body></html>
