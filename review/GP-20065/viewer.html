</head><body><script type="module">
import * as THREE from 'three';
import { makeOptic } from '../../studio/weapon-optics.js';

async function shoot(view='quarter', light='noon') {
  const presets = {
    noon: { sky:0xd5e4ff, ground:0x8d7b62, si:1.25, sun:0xfff4dc, ui:3.1, fill:0.16 },
