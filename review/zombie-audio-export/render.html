<!doctype html><meta charset="utf-8"><title>Zombie editing export</title>
<script type="module">
let seq=0;
const sr=48000;
const b64=f=>{const u=new Uint8Array(f.buffer);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s);};
window.renderBank=async(type,state)=>{
  const random=Math.random;let seed=177;
  Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  let oc;
  window.AudioContext=function(){oc=new OfflineAudioContext(2,sr*21,sr);return oc;};
  window.webkitAudioContext=window.AudioContext;
  try{
    const A=(await import('/core/audio.js?editingExport='+ ++seq)).AudioSys;
    A.setMuted(true);A.emptyClick();A.setMuted(false);A.setMusicVolume(0);
    await new Promise(r=>setTimeout(r,30));
    const actor={},choices=[],failures=[];
    const times=Array.from({length:4},(_,i)=>128*Math.ceil((128*20/sr+i*5)*sr/128)/sr);
    for(const time of times)oc.suspend(time).then(()=>{
      try{
        const before={...A.voiceCount};
        if(state==='hurt')A.zombieHit(1,0,false,type,actor);
        else if(state==='death')A.zombieDeath(1,0,['brute','demon','colossus','guardian'].includes(type),type,actor);
        else A.zombieVoice(type,state,1,0,actor);
        const prefix=type+':'+state+':phrase:';
        choices.push({time,keys:Object.keys(A.voiceCount).filter(k=>k.startsWith(prefix)&&A.voiceCount[k]>(before[k]||0))});
      }catch(e){failures.push(String(e.stack||e));}finally{oc.resume();}
    });
    const output=await oc.startRendering();
    if(failures.length)throw new Error(failures.join('\n'));
    return{sr,L:b64(output.getChannelData(0)),R:b64(output.getChannelData(1)),choices};
  }finally{Math.random=random;}
};
window.ready=true;
</script>
