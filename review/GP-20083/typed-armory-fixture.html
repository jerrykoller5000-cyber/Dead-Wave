<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/armory.css">
<style>
body { margin:0; background:#222; --font-hud:Arial,sans-serif; --ink:#e8e2c8; --accent:#e3b62b; --accent-2:#e3b62b; --accent-2-ink:#16180e; }
#cif { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; box-sizing:border-box; }
.card { display:none; }
</style>
<div id="cif" class="show armory-only"><div class="card"><div class="modes"></div></div></div>
<script type="module">
import { mountArmory } from '/ui/armory.js';
let typed = true;
let bought = '';
const stock = { kind:'shotgun', order:['birdshot','buckshot','slug'], loaded:'birdshot', inGun:5,
  carried:{birdshot:42,buckshot:15,slug:2}, next:'birdshot', switching:null, canSwitch:true,
  types:{birdshot:{name:'Birdshot',tag:'BIRD',pack:12,price:30,hull:'red',cap:60,canBuy:false,room:0},
    buckshot:{name:'Buckshot',tag:'BUCK',pack:12,price:50,hull:'green',cap:60,canBuy:true,room:45},
    slug:{name:'Slug',tag:'SLUG',pack:8,price:80,hull:'blue',cap:30,canBuy:true,room:28}} };
const ui = mountArmory({ getAmmoTypes:kind=>typed && kind==='shotgun' ? stock : null,
  onBuyAmmoType:(kind,type)=>{ bought=kind+':'+type; return {bought:12,price:50}; }, getCash:()=>60,
  getMods:()=>[], getOwned:()=>[], picture:async()=>null });
ui.open(); ui.bench('shotgun');
window.fixture = { ui, stock, get bought(){ return bought; }, showOld(){ typed=false; ui.render(); }, showTyped(){ typed=true; ui.render(); } };
</script>
