<!doctype html><meta charset="utf-8"><title>soundlab</title>
<script type="module">
// CL-134: renders AudioSys calls offline (an OfflineAudioContext in place of the real one), for tools/soundlab.mjs.
const SR = 48000;
let seq = 0;
function b64(f32) { const u8 = new Uint8Array(f32.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
// spec: { fn, args, times: [s...], len, calls: [[t, fn, args]...] }
window.renderOne = async (spec) => {
  let oc = null;
  window.AudioContext = function () { oc = new OfflineAudioContext(2, Math.ceil((spec.len || 2) * SR), SR); return oc; };
  window.webkitAudioContext = window.AudioContext;
  const A = (await import('../core/audio.js?v=' + (++seq))).AudioSys;
  A.setMuted(true); A.emptyClick(); A.setMuted(false);   // makes the context
  const at = (t) => Math.round((t + 0.05) * SR / 128) * 128 / SR;
  for (const t of spec.times || [0]) oc.suspend(at(t)).then(() => { A[spec.fn](...(spec.args || [])); oc.resume(); });
  for (const [t, fn, args] of spec.calls || []) oc.suspend(at(t)).then(() => { A[fn](...(args || [])); oc.resume(); });
  const buf = await oc.startRendering();
  return { sr: SR, L: b64(buf.getChannelData(0)), R: b64(buf.getChannelData(1)) };
};
window.ready = true;
</script>
